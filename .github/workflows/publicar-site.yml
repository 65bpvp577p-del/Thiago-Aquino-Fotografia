name: Publicar site com Supabase no GitHub Pages
on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'site.config.js'
      - 'site.js'
      - 'styles.css'
      - 'supabase-public-loader.js'
      - 'supabase-public-config.js'
      - 'database/**'
      - 'admin/**'
      - 'auth/**'
      - '.github/workflows/publicar-site.yml'
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: github-pages
  cancel-in-progress: false
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validar configuracao publica
        env:
          SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          SUPABASE_KEY: ${{ vars.VITE_SUPABASE_PUBLISHABLE_KEY }}
        run: |
          node - <<'NODE'
          const url=process.env.SUPABASE_URL||'',key=process.env.SUPABASE_KEY||'';
          if(!/^https:\/\/[a-z0-9-]+\.supabase\.co$/.test(url)||!key.startsWith('sb_publishable_')) throw Error('Variaveis publicas ausentes ou invalidas');
          NODE
      - name: Validar acesso publico a albuns e fotos
        env:
          SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          SUPABASE_KEY: ${{ vars.VITE_SUPABASE_PUBLISHABLE_KEY }}
        run: |
          node - <<'NODE'
          (async()=>{
            for(const [table,min] of [['albums',5],['photos',29]]){
              const url=new URL(process.env.SUPABASE_URL+'/rest/v1/'+table);
              url.searchParams.set('select','id');
              let response;
              for(let attempt=1;attempt<=3;attempt++){
                try{
                  response=await fetch(url,{headers:{apikey:process.env.SUPABASE_KEY},signal:AbortSignal.timeout(20000)});
                  break;
                }catch(error){
                  console.warn(table+': tentativa '+attempt+' sem resposta: '+error.message);
                  if(attempt<3)await new Promise(resolve=>setTimeout(resolve,2000*attempt));
                }
              }
              if(!response){console.warn(table+': verificacao remota indisponivel; publicacao mantida para nao bloquear alteracoes visuais.');continue;}
              if(!response.ok) throw Error(table+': HTTP '+response.status);
              const data=await response.json();
              if(!Array.isArray(data)||data.length<min) throw Error(table+': registros insuficientes');
              console.log(table+': '+data.length+' registros');
            }
          })().catch(e=>{console.error(e.message);process.exit(1)});
          NODE
      - name: Gerar configuracao publica para o navegador
        env:
          SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          SUPABASE_KEY: ${{ vars.VITE_SUPABASE_PUBLISHABLE_KEY }}
        run: |
          node - <<'NODE'
          const fs=require('fs');
          fs.writeFileSync('supabase-public-config.js','window.SUPABASE_PUBLIC_CONFIG = '+JSON.stringify({url:process.env.SUPABASE_URL,publishableKey:process.env.SUPABASE_KEY})+';\n');
          NODE
          node --check supabase-public-config.js
          node --check supabase-public-loader.js
          node --check admin/painel.mjs
          node --check admin/album-manager.mjs
          node --check auth/admin-auth.mjs
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: '.'
      # Aguarda a indexacao do artefato pela API do GitHub antes de implantar.
      - name: Aguardar disponibilidade do artefato
        run: sleep 20
      - id: deployment
        uses: actions/deploy-pages@v4
